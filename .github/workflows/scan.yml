name: scan

# Looks for exit headlines every 2 hours and opens an assigned issue per new candidate.
# Pause it: set the repository variable SCAN_PAUSED to true (Settings > Secrets and
# variables > Actions > Variables), or disable this workflow in the Actions tab.
on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
    inputs:
      fixture:
        description: "Optional path to a local RSS file to scan instead of the live feeds (testing)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  scan:
    if: vars.SCAN_PAUSED != 'true'
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan feeds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIXTURE: ${{ inputs.fixture }}
        run: node scripts/scan.mjs ${FIXTURE:+--fixture "$FIXTURE"}
      - name: Commit data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "scan: last checked $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: scan
    if: needs.scan.outputs.pushed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
